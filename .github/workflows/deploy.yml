name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Ensure Pages uses GitHub Actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          payload=$(printf '{"build_type":"workflow","source":{"branch":"%s","path":"/"}}' "$DEFAULT_BRANCH")
          pages_url="$API_URL/repos/${{ github.repository }}/pages"

          status=$(curl --silent --show-error --output /tmp/pages-response.json --write-out "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$pages_url" \
            -d "$payload")

          if [ "$status" = "404" ]; then
            status=$(curl --silent --show-error --output /tmp/pages-response.json --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$pages_url" \
              -d "$payload")
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Failed to configure GitHub Pages for workflow-based deployment (HTTP $status)."
            echo "Check that the workflow token has permission to manage GitHub Pages settings for this repository."
            cat /tmp/pages-response.json
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
